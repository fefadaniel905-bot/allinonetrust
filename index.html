<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>allinonetrust</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--mut:#94a3b8;--blue:#2563eb}
@media (prefers-color-scheme:dark){:root{color-scheme:dark}}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:#fff;font-family:-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:76px;padding-top:env(safe-area-inset-top)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;position:sticky;top:0;background:#0f172ae6;backdrop-filter:blur(10px);border-bottom:1px solid #ffffff12;z-index:5}
.logo{display:flex;align-items:center;gap:9px}.logo img{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#faf6ea;flex-shrink:0}.logo b{font-size:15px;display:block;line-height:1.15}.logo small{font-size:9px;color:var(--mut)}
button,.btn{font:inherit;cursor:pointer;border:0;color:#fff}
.blue{background:var(--blue);border-radius:99px;padding:10px 16px;font-size:12px;font-weight:600}.blue.full{width:100%;padding:14px;font-size:14px}
.wrap{padding:0 16px}h1{font-size:24px;line-height:1.2;margin:22px 0 8px}h1 span{color:#60a5fa}.mut{color:var(--mut);font-size:13px}
select,input,textarea{width:100%;background:var(--card);border:1px solid var(--line);color:#fff;border-radius:12px;padding:12px;font:inherit;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
#cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.cat{height:120px;border-radius:16px;padding:12px;display:flex;align-items:flex-end;cursor:pointer;font-size:13px;font-weight:700}
.cat small{display:block;font-weight:400;font-size:10px;opacity:.85;margin-top:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.biz{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;position:relative}
.biz.pr{border-color:#f9731666}.biz i{position:absolute;top:8px;right:8px;font-size:9px;font-style:normal;background:#f9731626;color:#fb923c;padding:2px 8px;border-radius:99px}
.biz .im{height:84px;background:#0f172a center/cover}.biz div.t{padding:10px;font-size:13px;font-weight:600}.biz div.t small{display:block;font-weight:400;color:var(--mut);font-size:11px;margin-top:2px}
.banner{height:170px;background:var(--card) center/cover}.pp{width:112px;height:112px;border-radius:50%;object-fit:cover;border:4px solid #fff;margin:-56px 0 0 24px;background:var(--card);display:block}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.gal img,.th img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;cursor:pointer}
.wa{display:block;text-align:center;background:#16a34a;color:#fff;text-decoration:none;font-weight:600;padding:15px;border-radius:99px;margin-top:20px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#0f172af5;border-top:1px solid #ffffff12;padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
nav a{font-size:10px;color:var(--mut);text-align:center;cursor:pointer}nav a.on{color:#60a5fa}nav a span{display:block;font-size:19px}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:14px 0 6px}.th{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.err{color:#f87171;font-size:12px;margin-top:10px}.ok{color:#4ade80;font-size:12px;margin-top:10px}.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;margin-top:12px}
#lightbox-overlay{display:none;position:fixed;inset:0;background:#000e;z-index:50;align-items:center;justify-content:center;padding:20px}#lightbox-overlay.on{display:flex}#lightbox-overlay img{max-width:100%;max-height:90vh;border-radius:10px}
.back{color:var(--mut);font-size:13px;padding:14px 16px;display:block;cursor:pointer}
</style></head><body>

<main id="app"></main>
<div id="lightbox-overlay" onclick="closeLightbox()"><img id="lb" alt=""></div>
<nav><a id="n-home" onclick="go('home')"><span>🏠</span>Home</a><a id="n-list" onclick="go('list',{})"><span>🔍</span>Search</a><a id="n-form" onclick="go('form')"><span>➕</span>List</a><a id="n-mine" onclick="go('mine')"><span>👤</span>Dashboard</a></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script>
/* ===== SETUP: paste your Supabase values here (Supabase > Settings > API) ===== */
const SUPABASE_URL='PASTE_YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY='PASTE_YOUR_SUPABASE_ANON_KEY';
/* ============================================================================ */
const CATS=[['accommodation','🏠','Accommodation','Guesthouses, lodges, B&Bs','#0e7490'],['engineering','🛠️','Engineering','Structural, civil, electrical firms','#475569'],['shops','🛍️','Shops & Trading','Retail, online orders via WhatsApp','#7c3aed'],['food','🍽️','Food & Dining','Restaurants, takeaways','#b45309'],['beauty','💈','Beauty & Barber','Salons, barbershops','#be185d'],['auto','🔧','Auto & Repair','Mechanics, panel beaters','#b91c1c'],['transport','🚐','Transport','Taxis, shuttles, courier rides','#0369a1'],['construction','🏗️','Construction','Builders, contractors, artisans','#a16207'],['materials','🧱','Building Materials','Hardware, cement, timber, fittings','#9a3412'],['leisure','🎉','Leisure & Entertainment','Lodges, events, sports, fun spots','#15803d']];
const R={'Erongo':['Swakopmund','Walvis Bay','Henties Bay','Omaruru','Usakos','Karibib','Arandis'],'Hardap':['Mariental','Rehoboth','Maltahöhe','Gibeon','Stampriet'],'//Karas':['Keetmanshoop','Lüderitz','Karasburg','Oranjemund','Bethanie'],'Kavango East':['Rundu','Mashare','Ndiyona'],'Kavango West':['Nkurenkuru','Mpungu'],'Khomas':['Windhoek'],'Kunene':['Opuwo','Outjo','Khorixas','Kamanjab'],'Ohangwena':['Eenhana','Okongo'],'Omaheke':['Gobabis','Witvlei','Leonardville'],'Omusati':['Outapi','Okahao','Oshikuku','Ruacana'],'Oshana':['Oshakati','Ongwediva','Ondangwa'],'Oshikoto':['Tsumeb','Omuthiya','Okankolo'],'Otjozondjupa':['Otjiwarongo','Grootfontein','Okahandja'],'Zambezi':['Katima Mulilo','Linyanti']};
let sb,me,list=[],view='home',f={},pics={profile:'',banner:'',imgs:[]},lightboxSrc=null;
const $=s=>document.querySelector(s),cat=id=>CATS.find(c=>c[0]==id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const opts=(a,sel,ph)=>`<option value="">${ph}</option>`+a.map(x=>`<option ${x==sel?'selected':''}>${esc(x)}</option>`).join('');
function openLightbox(s){lightboxSrc=s;$('#lb').src=s;$('#lightbox-overlay').classList.add('on')}
function closeLightbox(){lightboxSrc=null;$('#lightbox-overlay').classList.remove('on')}
function go(v,p){view=v;if(p)f=p;render();scrollTo(0,0)}
function sorted(a){return [...a].sort((x,y)=>(+!!y.is_premium-+!!x.is_premium)||((y.premium_until||0)-(x.premium_until||0))||((y.views||0)-(x.views||0)))}
function mine(){return list.find(b=>b.owner===me)}
function render(){if((view=='form'||view=='mine')&&!me)view='auth';document.querySelectorAll('nav a').forEach(a=>a.classList.remove('on'));const n={home:'home',list:'list',form:'form',mine:'mine',biz:'list',auth:'mine'}[view];$('#n-'+n)?.classList.add('on');const m=$('#app');
if(view=='home')m.innerHTML=`<div class="wrap"><h1>Find Any Business in Namibia. <span>Order on WhatsApp.</span></h1><p class="mut">Browse by category or search your region and town.</p><div class="two"><select id="r" onchange="fillT()">${opts(Object.keys(R),'','All Regions')}</select><select id="t" disabled><option value="">All Towns</option></select></div><button class="blue full" onclick="go('list',{region:$('#r').value,town:$('#t').value})">Search Businesses</button><p class="mut" style="margin:22px 0 4px;font-weight:600">Browse by Category</p><div id="cat-grid">${CATS.map(c=>`<div class="cat" style="background:linear-gradient(to top,#000d,#0003),${c[4]}" onclick="go('list',{category:'${c[0]}'})"><div>${c[1]} ${c[2]}<small>${c[3]}</small></div></div>`).join('')}</div></div>`;
else if(view=='list'){const a=sorted(list.filter(b=>(!f.category||b.category==f.category)&&(!f.region||b.region==f.region)&&(!f.town||b.town==f.town)));m.innerHTML=`<div class="wrap"><h1 style="font-size:19px">${f.category?cat(f.category)[1]+' '+cat(f.category)[2]:'All Businesses'}${f.town?' · '+esc(f.town):f.region?' · '+esc(f.region):''}</h1><div style="display:flex;gap:8px;overflow-x:auto;margin:12px 0">${CATS.map(c=>`<button class="blue" style="background:${f.category==c[0]?'#2563eb55':'#1e293b'};white-space:nowrap" onclick="go('list',{...f,category:'${c[0]}'})">${c[1]} ${c[2]}</button>`).join('')}</div><div class="grid">${a.map(b=>`<div class="biz ${b.is_premium?'pr':''}" onclick="openBiz('${b.id}')">${b.is_premium?'<i>🔥 Premium</i>':''}<div class="im" style="background-image:url('${esc(b.profile||b.images?.[0]||'')}')"></div><div class="t">${esc(b.name)}<small>${esc(b.town)}, ${esc(b.region)}</small></div></div>`).join('')||'<p class="mut" style="grid-column:1/3;text-align:center;padding:40px 0">No businesses listed here yet.</p>'}</div></div>`}
else if(view=='biz'){const b=list.find(x=>x.id==f.id);if(!b)return go('list',{});const c=cat(b.category),num=String(b.whatsapp).replace(/\D/g,'').replace(/^0/,''),msg=encodeURIComponent(`Hi, I saw your business ${b.name} on AllInOneTrust in ${c?c[2]:b.category}. I am interested.`);m.innerHTML=`<a class="back" onclick="go('list',{})">← Back</a><div class="banner" style="background-image:url('${esc(b.banner||'')}')"></div>${b.profile?`<img class="pp" src="${esc(b.profile)}" alt="">`:'<div style="height:24px"></div>'}<div class="wrap"><h1 style="font-size:21px;margin:12px 0 4px">${esc(b.name)}</h1><p class="mut">${c?c[1]+' '+c[2]:''} · ${esc(b.town)}, ${esc(b.region)}</p><p class="mut" style="margin-top:4px">👀 ${b.views||0} views</p><p style="font-size:14px;color:#cbd5e1;line-height:1.5;margin-top:14px">${esc(b.description)}</p><div class="gal">${(b.images||[]).map(s=>`<img src="${esc(s)}" onclick="openLightbox(this.src)" alt="">`).join('')}</div><a class="wa" href="https://wa.me/264${num}?text=${msg}" target="_blank" rel="noopener">💬 Chat on WhatsApp</a></div>`}
else if(view=='mine'){const b=mine();m.innerHTML=b?`<div class="wrap"><h1 style="font-size:21px">Your Business</h1><div class="box">👀 <b>${b.views||0}</b> people viewed your business</div><div class="box">${esc(b.name)} · ${b.is_premium?'🔥 Premium':'✅ Live'}<br><span class="mut">Normal N$89.99 · Premium N$149.99 (payments coming soon)</span></div><button class="blue full" style="margin-top:14px" onclick="openBiz('${b.id}')">View my public page</button><button class="blue full" style="margin-top:10px;background:#1e293b" onclick="go('form')">Edit listing</button><button class="blue full" style="margin-top:10px;background:#1e293b" onclick="sb.auth.signOut()">Log out</button></div>`:`<div class="wrap"><h1 style="font-size:21px">No listing yet</h1><button class="blue full" onclick="go('form')">List Your Business</button></div>`}
else if(view=='auth')authView();else form()}
function fillT(){const r=$('#r').value;$('#t').disabled=!r;$('#t').innerHTML=opts(R[r]||[],'','All Towns')}
async function openBiz(id){go('biz',{id});const b=list.find(x=>x.id==id);try{await sb.rpc('increment_business_views',{business_id:id});if(b)b.views=(b.views||0)+1}catch(e){}}
function form(){const b=mine()||{};if(b.id&&!pics.touched)pics={profile:b.profile||'',banner:b.banner||'',imgs:[...(b.images||[])],touched:1};
$('#app').innerHTML=`<div class="wrap"><h1 style="font-size:21px">${b.id?'Edit Your Business':'List Your Business'}</h1><label>Profile picture (200×200 circle)</label><input type="file" accept="image/*" onchange="up(this,'profile')">${pics.profile?`<img class="pp" style="margin:10px 0 0;width:80px;height:80px" src="${pics.profile}">`:''}<label>Banner (1200×400)</label><input type="file" accept="image/*" onchange="up(this,'banner')">${pics.banner?`<div class="banner" style="height:90px;border-radius:12px;margin-top:8px;background-image:url('${pics.banner}')"></div>`:''}<label>Business photos (${pics.imgs.length}/5, min 3)</label><div class="th">${pics.imgs.map((s,i)=>`<div><img src="${s}" onclick="pics.imgs.splice(${i},1);form()" alt=""></div>`).join('')}</div>${pics.imgs.length<5?`<input type="file" accept="image/*" multiple onchange="up(this,'imgs')">`:''}<p class="mut" style="font-size:11px;margin-top:4px">Tap a photo to remove it.</p><label>Business name</label><input id="n" value="${esc(b.name)}"><label>Category</label><select id="c">${CATS.map(c=>`<option value="${c[0]}" ${b.category==c[0]?'selected':''}>${c[1]} ${c[2]}</option>`).join('')}</select><div class="two"><select id="fr" onchange="$('#ft').innerHTML=opts(R[this.value]||[],'','Town')">${opts(Object.keys(R),b.region,'Region')}</select><select id="ft">${opts(R[b.region]||[],b.town,'Town')}</select></div><label>WhatsApp number</label><input id="w" type="tel" placeholder="081 234 5678" value="${esc(b.whatsapp)}"><label>Description</label><textarea id="d" rows="3">${esc(b.description)}</textarea><div id="msg"></div><button class="blue full" style="margin-top:16px" onclick="save()">${b.id?'Save Changes':'Publish Listing'}</button></div>`}
const BK={profile:'profile-pics',banner:'banners',imgs:'business-images'};
async function up(el,k){const fs=[...el.files];if(!fs.length)return;if(!me)return go('auth');const m=$('#msg');m&&(m.innerHTML='<p class="mut">Uploading…</p>');try{for(const x of (k=='imgs'?fs.slice(0,5-pics.imgs.length):fs.slice(0,1))){const p=`${me}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${(x.name.split('.').pop()||'jpg').toLowerCase()}`,r=await sb.storage.from(BK[k]).upload(p,x,{upsert:true});if(r.error)throw r.error;const u=sb.storage.from(BK[k]).getPublicUrl(p).data.publicUrl;k=='imgs'?pics.imgs.push(u):pics[k]=u}form()}catch(e){$('#msg').innerHTML=`<p class="err">Upload failed: ${esc(e.message||e)}</p>`}}
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
async function save(){const v=s=>$(s).value.trim(),e=t=>$('#msg').innerHTML=`<p class="err">${t}</p>`;if(!v('#n')||!v('#fr')||!v('#ft')||!v('#w'))return e('Please fill in name, region, town and WhatsApp number.');if(pics.imgs.length<3)return e(`Please add at least 3 photos (you have ${pics.imgs.length}).`);if(pics.imgs.length>5)return e('Maximum 5 photos.');const old=mine(),d={user_id:me,name:v('#n'),category:$('#c').value,region:v('#fr'),town:v('#ft'),whatsapp_number:v('#w'),description:v('#d'),profile_pic_url:pics.profile||null,banner_url:pics.banner||null,images:pics.imgs};const r=old?await sb.from('businesses').update(d).eq('id',old.id):await sb.from('businesses').insert({...d,slug:slug(d.name)+'-'+Date.now().toString(36)});if(r.error)return e('Could not save: '+esc(r.error.message));pics={profile:'',banner:'',imgs:[]};await load();go('mine')}
const norm=r=>({id:r.id,owner:r.user_id,name:r.name,category:r.category,region:r.region,town:r.town,whatsapp:r.whatsapp_number,description:r.description,profile:r.profile_pic_url,banner:r.banner_url,images:r.images||[],is_premium:r.is_premium,premium_until:r.premium_until?Date.parse(r.premium_until):0,views:r.views||0});
async function load(){const{data,error}=await sb.from('businesses').select('*');if(error)return $('#app').insertAdjacentHTML('afterbegin',`<p class="err" style="padding:12px 16px">Could not load listings: ${esc(error.message)}</p>`);list=data.map(norm);if(view!='form')render()}
const PW=/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/;let am=0,otp=0;
function setAm(n){am=n;otp=0;authView()}
function authView(msg,ok){$('#app').innerHTML=`<div class="wrap"><h1 style="font-size:22px">${am==1?'Create Account':'Log In'}</h1><p class="mut">Sign in to list and manage your business.</p><div class="two"><button class="blue" style="background:${am!=2?'#2563eb':'#1e293b'}" onclick="setAm(0)">Email</button><button class="blue" style="background:${am==2?'#2563eb':'#1e293b'}" onclick="setAm(2)">Phone OTP</button></div>${am==2?`<input id="ph" type="tel" placeholder="+264 81 234 5678" value="${esc(window._ph||'')}" ${otp?'disabled':''}>${otp?'<input id="ot" style="margin-top:8px" placeholder="Enter the code">':''}<button class="blue full" style="margin-top:12px" onclick="phone()">${otp?'Verify Code':'Send Code'}</button>`:`<input id="em" type="email" placeholder="Email" value="${esc(window._em||'')}"><input id="pw" type="password" placeholder="Password" style="margin-top:8px">${am==1?'<p class="mut" style="font-size:11px;margin-top:6px">8+ characters with an uppercase letter, lowercase letter, number and symbol.</p>':''}<button class="blue full" style="margin-top:12px" onclick="emailAuth()">${am==1?'Sign Up':'Log In'}</button><p class="mut" style="text-align:center;margin-top:10px;font-size:12px">${am==1?'Have an account? <a style="color:#60a5fa" onclick="setAm(0)">Log in</a>':'No account? <a style="color:#60a5fa" onclick="setAm(1)">Sign up</a>'}</p>`}<div id="msg">${msg?`<p class="${ok?'ok':'err'}">${esc(msg)}</p>`:''}</div><button class="blue full" style="margin-top:14px;background:#fff;color:#0f172a" onclick="sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}})">Continue with Google</button></div>`}
async function emailAuth(){const e=$('#em').value.trim(),p=$('#pw').value;window._em=e;if(am==1&&!PW.test(p))return authView('Password needs 8+ characters with an uppercase letter, lowercase letter, number and symbol.');const r=am==1?await sb.auth.signUp({email:e,password:p}):await sb.auth.signInWithPassword({email:e,password:p});if(r.error)return authView(r.error.message);if(am==1&&!r.data.session)authView('Account created. Check your email to confirm, then log in.',1)}
async function phone(){if(!otp){window._ph=$('#ph').value.trim();const r=await sb.auth.signInWithOtp({phone:window._ph});if(r.error)return authView(r.error.message);otp=1;return authView('Code sent by SMS.',1)}const r=await sb.auth.verifyOtp({phone:window._ph,token:$('#ot').value.trim(),type:'sms'});if(r.error)authView(r.error.message)}
(async()=>{render();if(SUPABASE_URL.startsWith('PASTE')){$('#app').insertAdjacentHTML('afterbegin','<p class="err" style="padding:12px 16px">Setup needed: paste your Supabase URL and anon key at the top of index.html.</p>');return}sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const{data}=await sb.auth.getSession();me=data.session?.user.id||null;sb.auth.onAuthStateChange((ev,s)=>{me=s?.user?.id||null;if(me&&view=='auth')view='mine';if(view!='form')render();load()});load()})();
</script></body></html>
